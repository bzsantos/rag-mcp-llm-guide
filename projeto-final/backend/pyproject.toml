[project]
name = "assistente-corporativo"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.12",
    "qdrant-client>=1.12",
    "ollama>=0.4",
    "openai>=1.50",
    "mcp>=1.0",
    "pypdf>=5.1",
    "alembic>=1.14",
    "tiktoken>=0.8",
    "tenacity>=9.0",
    "httpx>=0.27",
]

[tool.uv]
dev-dependencies = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
