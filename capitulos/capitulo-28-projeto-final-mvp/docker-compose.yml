services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: assistente
      POSTGRES_PASSWORD: assistente
      POSTGRES_DB: assistente_db
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistente"]
      interval: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]

  api:
    build: .
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8000:8000"]

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
